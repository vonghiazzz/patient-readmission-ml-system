name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify Huy production bundle is available
        run: |
          test -s models/production_huy/model.pkl
          test -s models/production_huy/preprocessing_state.json
          test -s models/production_huy/feature_manifest.json
          test -s models/production_huy/metadata.json
          test -s models/production_huy/reference_predictions.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Lint and formatting
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Tests and coverage
        run: python -m pytest --cov=src --cov-report=term-missing --cov-fail-under=60 -q

      - name: Build production image
        run: docker build --tag patient-readmission-api:ci .
